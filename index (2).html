<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f9fafb;
            --surface: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-top: 0;
            color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important; /* Quita el borde por defecto de la librería */
            margin-bottom: 15px;
        }

        .historial-section {
            margin-top: 25px;
        }

        .historial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .historial-header h2 {
            font-size: 1.1rem;
            margin: 0;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        li {
            background: #f3f4f6;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .fecha {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Escáner de Códigos QR</h1>
        
        <button id="btn-toggle" class="btn">Iniciar Cámara</button>
        
        <div id="reader" style="display: none;"></div>

        <div class="historial-section">
            <div class="historial-header">
                <h2>Códigos Registrados</h2>
                <button id="btn-clear" class="clear-btn" style="display: none;">Limpiar todo</button>
            </div>
            <ul id="lista-qr">
                </ul>
            <div id="empty-msg" class="empty-state">No hay registros guardados.</div>
        </div>
    </div>

    <script>
        // Variables globales
        let html5QrCode;
        let isScanning = false;
        
        const btnToggle = document.getElementById('btn-toggle');
        const btnClear = document.getElementById('btn-clear');
        const readerDiv = document.getElementById('reader');
        const listaQr = document.getElementById('lista-qr');
        const emptyMsg = document.getElementById('empty-msg');

        // Configuración del escáner
        const config = { 
            fps: 10, 
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                // Cuadro de escaneo adaptativo
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const edgeSize = Math.floor(minEdge * 0.7);
                return { width: edgeSize, height: edgeSize };
            }
        };

        // Cargar el historial al iniciar la página
        document.addEventListener('DOMContentLoaded', () => {
            html5QrCode = new Html5Qrcode("reader");
            renderHistorial();
        });

        // Alternar entre encender y apagar la cámara
        btnToggle.addEventListener('click', () => {
            if (!isScanning) {
                startScanner();
            } else {
                stopScanner();
            }
        });

        // Limpiar el historial de LocalStorage
        btnClear.addEventListener('click', () => {
            if (confirm('¿Seguro que deseas borrar todo el historial?')) {
                localStorage.removeItem('qr_history');
                renderHistorial();
            }
        });

        // Función para encender la cámara
        function startScanner() {
            readerDiv.style.display = 'block';
            btnToggle.textContent = 'Apagar Cámara';
            btnToggle.classList.add('btn-danger');
            isScanning = true;

            // 'environment' le indica que prefiera la cámara trasera en móviles
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).catch(err => {
                console.error("Error al iniciar la cámara:", err);
                alert("No se pudo acceder a la cámara. Asegúrate de dar los permisos necesarios.");
                stopScanner();
            });
        }

        // Función para apagar la cámara
        function stopScanner() {
            if (isScanning) {
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = 'none';
                    btnToggle.textContent = 'Iniciar Cámara';
                    btnToggle.classList.remove('btn-danger');
                    isScanning = false;
                }).catch(err => console.error("Error al detener la cámara:", err));
            }
        }

        // Qué pasa cuando encuentra un QR
        function onScanSuccess(decodedText, decodedResult) {
            // Detener el escáner inmediatamente para evitar lecturas duplicadas consecutivas
            stopScanner();
            
            // Vibración feedback (si el dispositivo lo soporta)
            if (navigator.vibrate) navigator.vibrate(100);

            // Guardar en LocalStorage con la fecha y hora actual
            const nuevoRegistro = {
                texto: decodedText,
                fecha: new Date().toLocaleString()
            };

            let historial = JSON.parse(localStorage.getItem('qr_history')) || [];
            historial.unshift(nuevoRegistro); // Agrega al inicio para ver el más reciente primero
            localStorage.setItem('qr_history', JSON.stringify(historial));

            // Actualizar la interfaz
            renderHistorial();
            
            // Breve alerta visual de éxito
            alert(`¡Código detectado con éxito!\nContenido: ${decodedText}`);
        }

        // Pintar el historial en pantalla
        function renderHistorial() {
            const historial = JSON.parse(localStorage.getItem('qr_history')) || [];
            listaQr.innerHTML = '';

            if (historial.length === 0) {
                emptyMsg.style.display = 'block';
                btnClear.style.display = 'none';
                return;
            }

            emptyMsg.style.display = 'none';
            btnClear.style.display = 'block';

            historial.forEach(item => {
                const li = document.createElement('li');
                
                // Si el texto es un enlace, hacerlo clickeable
                if (item.texto.startsWith('http://') || item.texto.startsWith('https://')) {
                    li.innerHTML = `<a href="${item.texto}" target="_blank" rel="noopener noreferrer">${item.texto}</a>`;
                } else {
                    li.textContent = item.texto;
                }

                const spanFecha = document.createElement('span');
                spanFecha.className = 'fecha';
                spanFecha.textContent = item.fecha;
                
                li.appendChild(spanFecha);
                listaQr.appendChild(li);
            });
        }
    </script>
</body>
</html>
