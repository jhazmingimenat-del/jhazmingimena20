<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
            margin-top: 0;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-stop {
            background-color: #ef4444;
        }
        .btn-stop:hover {
            background-color: #dc2626;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: none !important; /* Quita el borde por defecto de la librería */
        }

        .history-section {
            margin-top: 25px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            word-break: break-all;
        }

        .time-stamp {
            display: block;
            font-size: 11px;
            color: #6b7280;
            margin-top: 4px;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Escáner QR</h1>
    
    <button id="btn-scan" class="btn">Iniciar Cámara</button>
    <button id="btn-stop" class="btn btn-stop" style="display: none;">Detener Cámara</button>

    <div id="reader"></div>

    <div class="history-section">
        <h2>Historial de Registros</h2>
        <ul id="history-list" class="history-list">
            </ul>
    </div>
</div>

<script>
    const btnScan = document.getElementById('btn-scan');
    const btnStop = document.getElementById('btn-stop');
    const historyList = document.getElementById('history-list');
    
    // Instancia del escáner apuntando al div #reader
    const html5QrcodeScanner = new Html5Qrcode("reader");

    // Cargar historial inicial al abrir la página
    document.addEventListener('DOMContentLoaded', displayHistory);

    // Evento para iniciar la cámara
    btnScan.addEventListener('click', () => {
        btnScan.style.display = 'none';
        btnStop.style.display = 'block';

        // Configuración para forzar la cámara trasera en móviles y definir tamaño del escáner
        const config = { 
            fps: 10, 
            qrbox: { width: 250, height: 250 } 
        };

        html5QrcodeScanner.start(
            { facingMode: "environment" }, // Prioriza la cámara trasera
            config,
            onScanSuccess,
            onScanFailure
        ).catch(err => {
            alert("Error al acceder a la cámara: " + err);
            resetButtons();
        });
    });

    // Evento para detener la cámara manualmente
    btnStop.addEventListener('click', stopCamera);

    function stopCamera() {
        html5QrcodeScanner.stop().then(() => {
            resetButtons();
        }).catch(err => {
            console.error("Error al detener la cámara: ", err);
        });
    }

    function resetButtons() {
        btnScan.style.display = 'block';
        btnStop.style.display = 'none';
    }

    // Qué hacer cuando se reconoce un QR de manera exitosa
    function onScanSuccess(decodedText, decodedResult) {
        // Detener la cámara tras una lectura exitosa (opcional, pero recomendado)
        stopCamera();

        // Obtener fecha y hora actual formateada
        const now = new Date();
        const dateTimeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

        // Guardar en el almacenamiento local (LocalStorage)
        saveToLocalStorage(decodedText, dateTimeStr);

        // Actualizar la interfaz visual
        displayHistory();

        // Alerta visual de éxito
        alert(`¡Código detectado con éxito!\nContenido: ${decodedText}`);
    }

    // Manejo de errores de escaneo continuos (la librería busca QR constantemente, suele ignorarse)
    function onScanFailure(error) {
        // console.warn(`Error de escaneo: ${error}`);
    }

    // Guardar datos en LocalStorage
    function saveToLocalStorage(text, datetime) {
        let history = JSON.parse(localStorage.getItem('qr_history')) || [];
        // Insertamos al principio para que el más nuevo salga arriba
        history.unshift({ text: text, datetime: datetime });
        localStorage.setItem('qr_history', JSON.stringify(history));
    }

    // Mostrar el historial en pantalla
    function displayHistory() {
        historyList.innerHTML = '';
        let history = JSON.parse(localStorage.getItem('qr_history')) || [];

        if (history.length === 0) {
            historyList.innerHTML = '<li class="empty-state">No hay códigos registrados aún.</li>';
            return;
        }

        history.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            
            // Si el texto parece un enlace, lo hacemos clickeable
            if (item.text.startsWith('http://') || item.text.startsWith('https://')) {
                li.innerHTML = `<a href="${item.text}" target="_blank" style="color: var(--primary); font-weight: 500;">${item.text}</a>`;
            } else {
                li.textContent = item.text;
            }

            const spanTime = document.createElement('span');
            spanTime.className = 'time-stamp';
            spanTime.textContent = `📅 Presenciado el: ${item.datetime}`;
            
            li.appendChild(spanTime);
            historyList.appendChild(li);
        });
    }
</script>

</body>
</html>
