<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Personal y Asistencia QR</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="container mx-auto p-4 max-w-6xl">
        <header class="bg-blue-600 text-white p-6 rounded-lg shadow-md mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Panel de Control de Personal</h1>
                <p class="text-sm opacity-90">Gestión de trabajadores, asistencia por QR y respaldos</p>
            </div>
            <div class="flex gap-2">
                <button onclick="abrirModalTrabajador()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded font-semibold text-sm transition shadow">
                    + Nuevo Trabajador
                </button>
                <button onclick="exportarBackup()" class="bg-purple-500 hover:bg-purple-600 px-4 py-2 rounded font-semibold text-sm transition shadow">
                    📦 Exportar Backup (.js)
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-4 rounded-lg shadow-md flex flex-col items-center justify-center">
                <h2 class="text-lg font-bold mb-3 text-gray-700">Control de Asistencia QR</h2>
                <div id="reader" class="w-full max-w-xs border-2 border-dashed border-gray-300 rounded" style="min-height: 250px;"></div>
                <button onclick="iniciarEscaneo()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium w-full">
                    📷 Activar Cámara QR
                </button>
            </div>

            <div class="bg-white p-4 rounded-lg shadow-md lg:col-span-2">
                <h2 class="text-lg font-bold mb-2 text-gray-700">Calendario de Asistencias</h2>
                <div id="calendar" class="max-h-[400px] text-xs"></div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <h2 class="text-lg font-bold text-gray-700">Listado de Trabajadores (CRUD)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-200">
                            <th class="p-3">ID / QR</th>
                            <th class="p-3">Nombre Completo</th>
                            <th class="p-3">Puesto</th>
                            <th class="p-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-trabajadores" class="divide-y divide-gray-200 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Datos iniciales precargados (20 Trabajadores)
        let trabajadores = [
            { id: "EMP-01", nombre: "Juan Pérez", puesto: "Gerente" },
            { id: "EMP-02", nombre: "María Gómez", puesto: "Desarrolladora" },
            { id: "EMP-03", nombre: "Carlos López", puesto: "Diseñador UX" },
            { id: "EMP-04", nombre: "Ana Rodríguez", puesto: "Soporte Técnico" },
            { id: "EMP-05", nombre: "Luis Martínez", puesto: "Administrador" },
            { id: "EMP-06", nombre: "Sofía Hernández", puesto: "Recursos Humanos" },
            { id: "EMP-07", nombre: "Diego Díaz", puesto: "Contador" },
            { id: "EMP-08", nombre: "Lucía Álvarez", puesto: "Marketing" },
            { id: "EMP-09", nombre: "Pedro Ruiz", puesto: "Seguridad" },
            { id: "EMP-10", nombre: "Elena Torres", puesto: "Sistemas" },
            { id: "EMP-11", nombre: "Miguel Ángel", puesto: "Logística" },
            { id: "EMP-12", nombre: "Laura Morales", puesto: "Recepcionista" },
            { id: "EMP-13", nombre: "Jorge Castro", puesto: "Analista de Datos" },
            { id: "EMP-14", nombre: "Claudia Ortiz", puesto: "SEO Expert" },
            { id: "EMP-15", nombre: "Andrés Silva", puesto: "Project Manager" },
            { id: "EMP-16", nombre: "Patricia Vega", puesto: "QA Engineer" },
            { id: "EMP-17", nombre: "Ricardo Flores", puesto: "DevOps" },
            { id: "EMP-18", nombre: "Natalia Benítez", puesto: "Redactora Content" },
            { id: "EMP-19", nombre: "Gabriel Navarro", puesto: "Legal" },
            { id: "EMP-20", nombre: "Isabel Méndez", puesto: "Finanzas" }
        ];

        let asistencias = [
            { title: "Juan Pérez (Presente)", start: new Date().toISOString().split('T')[0], color: '#10B981' }
        ];

        let calendar;
        let html5QrcodeScanner;

        // Inicialización del Sistema
        document.addEventListener('DOMContentLoaded', () => {
            renderTrabajadores();
            inicializarCalendario();
        });

        // 2. Renderizar Tabla de Trabajadores
        function renderTrabajadores() {
            const tbody = document.getElementById('tabla-trabajadores');
            tbody.innerHTML = '';
            trabajadores.forEach(t => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-3 font-mono font-bold text-blue-600">${t.id}</td>
                        <td class="p-3 font-medium">${t.nombre}</td>
                        <td class="p-3 text-gray-600">${t.puesto}</td>
                        <td class="p-3 flex gap-2">
                            <button onclick="abrirModalTrabajador('${t.id}')" class="text-blue-500 hover:text-blue-700 font-medium text-xs bg-blue-50 px-2 py-1 rounded">Editar</button>
                            <button onclick="eliminarTrabajador('${t.id}')" class="text-red-500 hover:text-red-700 font-medium text-xs bg-red-50 px-2 py-1 rounded">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 3. Inicializar FullCalendar
        function inicializarCalendario() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                events: asistencias,
                dateClick: function(info) {
                    gestionarAsistenciaManual(info.dateStr);
                }
            });
            calendar.render();
        }

        // 4. Formulario Interactivo (Crear / Editar) con SweetAlert2
        async function abrirModalTrabajador(id = null) {
            const esEdicion = id !== null;
            const trabajador = esEdicion ? trabajadores.find(t => t.id === id) : { id: '', nombre: '', puesto: '' };

            const { value: formValues } = await Swal.fire({
                title: esEdicion ? 'Editar Trabajador' : 'Registrar Nuevo Trabajador',
                html: `
                    <input id="swal-id" class="swal2-input !text-sm" placeholder="ID de Empleado (Ej: EMP-21)" value="${trabajador.id}" ${esEdicion ? 'disabled' : ''}>
                    <input id="swal-nombre" class="swal2-input !text-sm" placeholder="Nombre Completo" value="${trabajador.nombre}">
                    <input id="swal-puesto" class="swal2-input !text-sm" placeholder="Puesto / Cargo" value="${trabajador.puesto}">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => {
                    const idVal = document.getElementById('swal-id').value.trim();
                    const nombreVal = document.getElementById('swal-nombre').value.trim();
                    const puestoVal = document.getElementById('swal-puesto').value.trim();
                    
                    if (!idVal || !nombreVal || !puestoVal) {
                        Swal.showValidationMessage('Todos los campos son obligatorios');
                        return false;
                    }
                    if (!esEdicion && trabajadores.some(t => t.id === idVal)) {
                        Swal.showValidationMessage('El ID ya se encuentra registrado');
                        return false;
                    }
                    return { id: idVal, nombre: nombreVal, puesto: puestoVal };
                }
            });

            if (formValues) {
                if (esEdicion) {
                    const idx = trabajadores.findIndex(t => t.id === id);
                    trabajadores[idx] = { ...trabajadores[idx], nombre: formValues.nombre, puesto: formValues.puesto };
                    Swal.fire('¡Actualizado!', 'Datos modificados con éxito.', 'success');
                } else {
                    trabajadores.push(formValues);
                    Swal.fire('¡Registrado!', 'Trabajador añadido correctamente.', 'success');
                }
                renderTrabajadores();
            }
        }

        // 5. Eliminar Registro
        function eliminarTrabajador(id) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: `Vas a eliminar al trabajador con ID: ${id}`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#EF4444',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    trabajadores = trabajadores.filter(t => t.id !== id);
                    renderTrabajadores();
                    Swal.fire('Eliminado', 'El registro ha sido borrado.', 'success');
                }
            });
        }

        // 6. Registro de Asistencias mediante QR (Cámara del dispositivo)
        function iniciarEscaneo() {
            if(html5QrcodeScanner) html5QrcodeScanner.clear();

            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((qrCodeMessage) => {
                // Se ejecuta al detectar un código QR exitosamente
                const empleado = trabajadores.find(t => t.id === qrCodeMessage.trim());
                
                if (empleado) {
                    registrarAsistenciaEvento(empleado);
                    Swal.fire('¡Asistencia Registrada!', `${empleado.nombre} ha marcado entrada.`, 'success');
                    html5QrcodeScanner.clear(); // Detener cámara tras detectar
                } else {
                    Swal.fire('Error de Escaneo', `El código "${qrCodeMessage}" no pertenece a ningún trabajador registrado.`, 'error');
                }
            }, (errorMessage) => {
                // Silenciar errores comunes de búsqueda de QR en el frame
            });
        }

        function registrarAsistenciaEvento(empleado, fecha = null) {
            const targetDate = fecha || new Date().toISOString().split('T')[0];
            const nuevaAsistencia = {
                title: `${empleado.nombre} (QR)`,
                start: targetDate,
                color: '#10B981'
            };
            asistencias.push(nuevaAsistencia);
            calendar.addEvent(nuevaAsistencia);
        }

        // 7. Gestión Manual Interactiva de Asistencias (Haciendo click en un día del calendario)
        async function gestionarAsistenciaManual(fechaSeleccionada) {
            let opcionesTrabajadores = trabajadores.reduce((acc, t) => {
                acc[t.id] = t.nombre;
                return acc;
            }, {});

            const { value: empleadoId } = await Swal.fire({
                title: `Asistencia para el ${fechaSeleccionada}`,
                input: 'select',
                inputOptions: opcionesTrabajadores,
                inputPlaceholder: 'Selecciona un trabajador',
                showCancelButton: true,
                confirmButtonText: 'Registrar Presente',
                cancelButtonText: 'Cerrar'
            });

            if (empleadoId) {
                const empleado = trabajadores.find(t => t.id === empleadoId);
                registrarAsistenciaEvento(empleado, fechaSeleccionada);
                Swal.fire('Registrado', `Asistencia manual añadida para ${empleado.nombre}`, 'success');
            }
        }

        // 8. Exportar Archivo JS de Respaldo (Backup)
        function exportarBackup() {
            const backupData = `// Backup del Sistema de Personal\nconst backupTrabajadores = ${JSON.stringify(trabajadores, null, 4)};\nconst backupAsistencias = ${JSON.stringify(asistencias, null, 4)};`;
            
            const blob = new Blob([backupData], { type: "application/javascript;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = `backup_personal_${new Date().toISOString().split('T')[0]}.js`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
