<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia QR Estable</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        /* Contenedor del video de la cámara */
        #reader {
            width: 100%;
            max-width: 360px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }
        /* Corregir orientación de la cámara en algunos móviles */
        #reader video {
            object-fit: cover !important;
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans p-4 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-xl space-y-6 text-center">
        <h1 class="text-2xl font-bold text-slate-800">Control de Asistencia QR</h1>
        <p class="text-sm text-slate-500">Presiona el botón para escanear el DNI del trabajador</p>

        <div class="flex justify-center">
            <div id="reader"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="encenderCamara()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition active:scale-95">
                📷 Activar Cámara
            </button>
            <button onclick="apagarCamara()" class="bg-slate-600 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition active:scale-95">
                🛑 Apagar
            </button>
        </div>

        <div class="text-left border-t border-slate-100 pt-4">
            <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2">Últimos Registros</h3>
            <ul id="log-asistencias" class="text-sm text-slate-600 space-y-1 list-disc list-inside">
                <li class="text-slate-400 list-none">Ningún escaneo en esta sesión aún...</li>
            </ul>
        </div>
    </div>

    <script>
        // Base de datos simulada (20 registros en memoria para validar)
        const trabajadores = [
            {dni:"45871293", nombre:"Carlos Mendoza"}, {dni:"71239485", nombre:"Ana Quispe"},
            {dni:"10485762", nombre:"Jorge Flores"}, {dni:"48921357", nombre:"María Gonzales"},
            {dni:"73418925", nombre:"Diego Ramírez"}, {dni:"09845127", nombre:"Claudia Diaz"},
            {dni:"42163859", nombre:"Juan Espinoza"}, {dni:"75192843", nombre:"Andrea Torres"},
            {dni:"16734928", nombre:"Luis Rojas"}, {dni:"44321987", nombre:"Diana Castillo"},
            {dni:"70654321", nombre:"Ricardo Villanueva"}, {dni:"25814736", nombre:"Gabriela Ramos"},
            {dni:"47392158", nombre:"Alejandro Salazar"}, {dni:"72159483", nombre:"Natalia Benitez"},
            {dni:"08426179", nombre:"Manuel Cruz"}, {dni:"46912385", nombre:"Valeria Campos"},
            {dni:"74381925", nombre:"Christian Medina"}, {dni:"15934826", nombre:"Paola Silva"},
            {dni:"41273958", nombre:"Roberto Alva"}, {dni:"76541239", nombre:"Camila Paredes"}
        ];

        let html5Qrcode = null;

        function encenderCamara() {
            // Instanciar el lector en el div #reader si no existe
            if (!html5Qrcode) {
                html5Qrcode = new Html5Qrcode("reader");
            }

            // Configuración estricta para móviles
            const config = { 
                fps: 15,                  // Velocidad de escaneo por segundo
                qrbox: { width: 230, height: 230 } // Cuadro de enfoque
            };

            // Intentar arrancar usando la cámara trasera ("environment")
            html5Qrcode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                onScanFailure
            ).catch(err => {
                // Si falla (por ejemplo en PC sin cámara trasera), intenta con cualquier cámara disponible
                console.warn("Fallo cámara trasera, intentando cámara por defecto...", err);
                html5Qrcode.start({ facingMode: "user" }, config, onScanSuccess, onScanFailure)
                .catch(errorFinal => {
                    Swal.fire({
                        title: 'Error de Cámara',
                        text: 'No se pudo acceder a la cámara. Asegúrate de estar usando HTTPS (conexión segura) y de haber aceptado los permisos en tu móvil.',
                        icon: 'error'
                    });
                });
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Al encontrar un QR con éxito, pausamos o apagamos para que no parpadee repetidamente
            apagarCamara();

            // Buscar si el DNI escaneado existe en la lista
            const dniLimpio = decodedText.trim();
            const empleado = trabajadores.find(t => t.dni === dniLimpio);

            if (!empleado) {
                Swal.fire({
                    title: 'Código No Reconocido',
                    text: `El DNI [${dniLimpio}] no pertenece a ningún trabajador registrado.`,
                    icon: 'warning'
                }).then(() => encenderCamara()); // Reiniciar cámara al cerrar alerta
                return;
            }

            // Si el empleado existe, preguntar Tipo de Marcaje con SweetAlert2
            Swal.fire({
                title: `Hola, ${empleado.nombre}`,
                text: `¿Qué tipo de registro deseas realizar para el DNI ${empleado.dni}?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '✅ Entrada',
                cancelButtonText: '❌ Salida',
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#f43f5e',
            }).then((result) => {
                const tipo = result.isConfirmed ? "Entrada" : "Salida";
                const horaActual = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                
                // Agregar al historial de la pantalla
                const log = document.getElementById('log-asistencias');
                if(log.innerText.includes("Ningún escaneo")) log.innerHTML = ""; // Limpiar texto inicial
                
                log.innerHTML = `<li class="font-medium text-slate-700"><b>${horaActual}</b> - ${empleado.nombre} (${tipo})</li>` + log.innerHTML;

                Swal.fire('¡Registrado!', `${tipo} marcada correctamente a las ${horaActual}.`, 'success')
                    .then(() => encenderCamara()); // Volver a activar la cámara para el siguiente trabajador
            });
        }

        function onScanFailure(error) {
            // Esta función se ejecuta continuamente buscando códigos en el video. 
            // La dejamos vacía para no saturar la consola del navegador.
        }

        function apagarCamara() {
            if (html5Qrcode && html5Qrcode.isScanning) {
                html5Qrcode.stop().then(() => {
                    document.getElementById('reader').innerHTML = ""; // Limpiar visor
                    html5Qrcode = null; // Resetear instancia
                }).catch(err => console.error("Error al detener cámara:", err));
            }
        }
    </script>
</body>
</html>
