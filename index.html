<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Control de Asistencia Móvil QR</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

    <div class="container mx-auto p-4 max-w-5xl">
        <header class="bg-slate-800 p-6 rounded-2xl shadow-xl mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 border border-slate-700">
            <div>
                <h1 class="text-2xl font-black text-emerald-400">Panel de Asistencia QR</h1>
                <p class="text-xs text-slate-400">Optimizado para escaneo directo con dispositivo móvil</p>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="abrirModalTrabajador()" class="flex-1 sm:flex-none bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-4 py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg shadow-emerald-500/20">
                    + Nuevo Personal
                </button>
                <button onclick="exportarBackup()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg shadow-indigo-600/20">
                    📦 Exportar (.JS)
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            
            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-col items-center">
                <h2 class="text-sm font-bold tracking-wider uppercase text-slate-400 mb-3 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Lector QR de Cámara
                </h2>
                
                <div class="relative w-full aspect-square max-w-[280px] bg-black rounded-xl overflow-hidden border-2 border-slate-600">
                    <video id="preview" class="w-full h-full object-cover"></video>
                    <div class="absolute inset-0 border-2 border-emerald-500/30 pointer-events-none rounded-xl flex items-center justify-center">
                        <div class="w-48 h-48 border-2 border-dashed border-emerald-400/70 rounded-lg"></div>
                    </div>
                </div>

                <button onclick="encenderCamaraMovil()" class="mt-4 w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider shadow-md transition-all">
                    📸 Abrir Cámara Trasera
                </button>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 md:col-span-2">
                <h2 class="text-sm font-bold tracking-wider uppercase text-slate-400 mb-3">Historial de Asistencias</h2>
                <div id="calendar" class="text-xs text-slate-200 bg-slate-900 p-3 rounded-xl border border-slate-700"></div>
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
            <div class="p-4 bg-slate-750 border-b border-slate-700">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Trabajadores Registrados (20 iniciales)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-900 text-slate-400 text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Código QR</th>
                            <th class="p-4">Trabajador</th>
                            <th class="p-4">Cargo / Puesto</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-trabajadores" class="divide-y divide-slate-700 text-xs">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Base de datos con los 20 registros iniciales solicitados
        let trabajadores = [
            { id: "EMP-01", nombre: "Juan Pérez", puesto: "Gerente" },
            { id: "EMP-02", nombre: "María Gómez", puesto: "Desarrolladora" },
            { id: "EMP-03", nombre: "Carlos López", puesto: "Diseñador UX" },
            { id: "EMP-04", nombre: "Ana Rodríguez", puesto: "Soporte Técnico" },
            { id: "EMP-05", nombre: "Luis Martínez", puesto: "Administrador" },
            { id: "EMP-06", nombre: "Sofía Hernández", puesto: "Recursos Humanos" },
            { id: "EMP-07", nombre: "Diego Díaz", puesto: "Contador" },
            { id: "EMP-08", nombre: "Lucía Álvarez", puesto: "Marketing" },
            { id: "EMP-09", nombre: "Pedro Ruiz", puesto: "Seguridad" },
            { id: "EMP-10", nombre: "Elena Torres", puesto: "Sistemas" },
            { id: "EMP-11", mail: "", nombre: "Miguel Ángel", puesto: "Logística" },
            { id: "EMP-12", nombre: "Laura Morales", puesto: "Recepcionista" },
            { id: "EMP-13", nombre: "Jorge Castro", puesto: "Analista de Datos" },
            { id: "EMP-14", nombre: "Claudia Ortiz", puesto: "SEO Expert" },
            { id: "EMP-15", nombre: "Andrés Silva", puesto: "Project Manager" },
            { id: "EMP-16", nombre: "Patricia Vega", puesto: "QA Engineer" },
            { id: "EMP-17", nombre: "Ricardo Flores", puesto: "DevOps" },
            { id: "EMP-18", nombre: "Natalia Benítez", puesto: "Redactora Content" },
            { id: "EMP-19", nombre: "Gabriel Navarro", puesto: "Legal" },
            { id: "EMP-20", nombre: "Isabel Méndez", puesto: "Finanzas" }
        ];

        let asistencias = [];
        let calendar;
        let scannerMobile;

        document.addEventListener('DOMContentLoaded', () => {
            renderTrabajadores();
            inicializarCalendario();
        });

        function renderTrabajadores() {
            const tbody = document.getElementById('tabla-trabajadores');
            tbody.innerHTML = '';
            trabajadores.forEach(t => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-750/50 transition-colors">
                        <td class="p-4 font-mono font-bold text-emerald-400">${t.id}</td>
                        <td class="p-4 font-semibold text-slate-200">${t.nombre}</td>
                        <td class="p-4 text-slate-400">${t.puesto}</td>
                        <td class="p-4 flex justify-center gap-2">
                            <button onclick="abrirModalTrabajador('${t.id}')" class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 font-bold transition">Editar</button>
                            <button onclick="eliminarTrabajador('${t.id}')" class="px-2.5 py-1 rounded-md bg-red-500/10 text-red-400 hover:bg-red-500/20 font-bold transition">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function inicializarCalendario() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                events: asistencias,
                dateClick: function(info) {
                    gestionarAsistenciaManual(info.dateStr);
                }
            });
            calendar.render();
        }

        // CONTROL EXCLUSIVO DE CÁMARA MÓVIL (Instascan)
        function encenderCamaraMovil() {
            if (scannerMobile) {
                scannerMobile.stop();
            }

            scannerMobile = new Instascan.Scanner({ 
                video: document.getElementById('preview'), 
                mirror: false // Desactivar espejo para leer QRs correctamente
            });

            scannerMobile.addListener('scan', function (content) {
                const empleado = trabajadores.find(t => t.id === content.trim());
                if (empleado) {
                    registrarAsistenciaEfectiva(empleado);
                    Swal.fire({
                        title: '¡QR Escaneado!',
                        text: `Asistencia registrada para: ${empleado.nombre}`,
                        icon: 'success',
                        background: '#1e293b',
                        color: '#fff'
                    });
                } else {
                    Swal.fire({
                        title: 'Código Desconocido',
                        text: `El QR "${content}" no coincide con ningún empleado.`,
                        icon: 'error',
                        background: '#1e293b',
                        color: '#fff'
                    });
                }
            });

            // Forzar búsqueda de la cámara trasera del smartphone
            Instascan.Camera.getCameras().then(function (cameras) {
                if (cameras.length > 0) {
                    // Selecciona por defecto la última cámara detectada (usualmente la trasera en móviles)
                    let camaraTrasera = cameras[cameras.length - 1]; 
                    
                    // Si detecta múltiples, buscar explícitamente palabras clave de cámara trasera
                    for(let i=0; i<cameras.length; i++) {
                        if(cameras[i].name.toLowerCase().includes('back') || cameras[i].name.toLowerCase().includes('trasera') || cameras[i].name.toLowerCase().includes('environment')) {
                            camaraTrasera = cameras[i];
                            break;
                        }
                    }
                    
                    scannerMobile.start(camaraTrasera).catch(e => {
                        Swal.fire('Error de Acceso', 'Asegúrate de dar permisos de cámara al navegador.', 'error');
                    });
                } else {
                    Swal.fire('Error', 'No se detectaron cámaras en este dispositivo.', 'error');
                }
            }).catch(function (e) {
                console.error(e);
                Swal.fire('Error Crítico', 'No se pudo acceder al hardware de video.', 'error');
            });
        }

        function registrarAsistenciaEfectiva(empleado, fecha = null) {
            const dateStr = fecha || new Date().toISOString().split('T')[0];
            const nuevaAsistencia = {
                title: `${empleado.nombre} (Presente)`,
                start: dateStr,
                color: '#10B981'
            };
            asistencias.push(nuevaAsistencia);
            calendar.addEvent(nuevaAsistencia);
        }

        // CRUD: Crear y Editar con Formularios Interactivos de SweetAlert2
        async function abrirModalTrabajador(id = null) {
            const esEdicion = id !== null;
            const t = esEdicion ? trabajadores.find(emp => emp.id === id) : { id: '', nombre: '', puesto: '' };

            const { value: formValues } = await Swal.fire({
                title: `<span style="color:#34d399">${esEdicion ? 'Editar Registro' : 'Nuevo Registro'}</span>`,
                background: '#1e293b',
                color: '#fff',
                html: `
                    <input id="swal-id" class="swal2-input !bg-slate-900 !text-white !border-slate-700" placeholder="Código de QR (Ej: EMP-21)" value="${t.id}" ${esEdicion ? 'disabled' : ''}>
                    <input id="swal-nombre" class="swal2-input !bg-slate-900 !text-white !border-slate-700" placeholder="Nombre completo" value="${t.nombre}">
                    <input id="swal-puesto" class="swal2-input !bg-slate-900 !text-white !border-slate-700" placeholder="Puesto" value="${t.puesto}">
                `,
                showCancelButton: true,
                confirmButtonText: 'Confirmar',
                cancelButtonText: 'Cancelar',
                preConfirm: () => {
                    const idVal = document.getElementById('swal-id').value.trim();
                    const nVal = document.getElementById('swal-nombre').value.trim();
                    const pVal = document.getElementById('swal-puesto').value.trim();
                    if(!idVal || !nVal || !pVal) { Swal.showValidationMessage('Rellena todos los campos'); return false; }
                    if(!esEdicion && trabajadores.some(emp => emp.id === idVal)) { Swal.showValidationMessage('ID Duplicado'); return false; }
                    return { id: idVal, nombre: nVal, puesto: pVal };
                }
            });

            if (formValues) {
                if (esEdicion) {
                    const idx = trabajadores.findIndex(emp => emp.id === id);
                    trabajadores[idx] = { ...trabajadores[idx], nombre: formValues.nombre, puesto: formValues.puesto };
                } else {
                    trabajadores.push(formValues);
                }
                renderTrabajadores();
                Swal.fire({ icon: 'success', title: 'Guardado', background: '#1e293b', color: '#fff' });
            }
        }

        // CRUD: Eliminar Registro
        function eliminarTrabajador(id) {
            Swal.fire({
                title: '¿Eliminar trabajador?',
                text: `ID: ${id}`,
                icon: 'warning',
                background: '#1e293b',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, borrar'
            }).then((result) => {
                if (result.isConfirmed) {
                    trabajadores = trabajadores.filter(t => t.id !== id);
                    renderTrabajadores();
                    Swal.fire({ title: 'Eliminado', icon: 'success', background: '#1e293b', color: '#fff' });
                }
            });
        }

        // Gestión manual interactiva de asistencias mediante clic en el calendario
        async function gestionarAsistenciaManual(fechaSeleccionada) {
            let options = trabajadores.reduce((acc, t) => { acc[t.id] = t.nombre; return acc; }, {});
            const { value: empleadoId } = await Swal.fire({
                title: 'Control Manual de Asistencia',
                text: `Fecha: ${fechaSeleccionada}`,
                input: 'select',
                inputOptions: options,
                inputPlaceholder: 'Selecciona al trabajador',
                background: '#1e293b',
                color: '#fff',
                showCancelButton: true
            });
            if (empleadoId) {
                const emp = trabajadores.find(t => t.id === empleadoId);
                registrarAsistenciaEfectiva(emp, fechaSeleccionada);
            }
        }

        // Exportar archivo JS con los datos de Backup
        function exportarBackup() {
            const dataStr = `// RESPALDO DE ASISTENCIA Y PERSONAL\nconst backupTrabajadores = ${JSON.stringify(trabajadores, null, 4)};\nconst backupAsistencias = ${JSON.stringify(asistencias, null, 4)};`;
            const blob = new Blob([dataStr], { type: "application/javascript" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_asistencia_${new Date().toISOString().split('T')[0]}.js`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
